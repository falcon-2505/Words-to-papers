  obj(4+3*i,()=>w('<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream'));

 }
 const total=3*n+3,xr=pos;
 w('xref\n0 '+total+'\n0000000000 65535 f \n');
 for(let id=1;id<total;id++)w(String(off[id]).padStart(10,'0')+' 00000 n \n');
 w('trailer\n<</Size '+total+'/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF');
 return new Blob(chunks,{type:'application/pdf'});
